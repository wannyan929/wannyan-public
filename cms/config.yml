# 編集用のデータは cms-data/ に置き、GitHub Actions が公開用 JSON に変換します。
# 認証サーバーの接続が終わるまでログイン画面は公開しません。
backend:
  name: github
  repo: wannyan929/wannyan-public
  branch: main
  # auth_endpoint は安全な OAuth 仲介 Worker の動作確認後に設定する。
locale: ja
media_folder: "images"
public_folder: "images"
# CMS で選んだ写真の保存先は images/。公開ページも同じ相対パスを参照します。
collections:
  - name: updates
    label: 秘密結社の更新
    files:
      - name: events
        label: 任務予定
        file: cms-data/events.json
        format: json
        fields:
          - label: 任務予定一覧
            name: entries
            widget: list
            required: false
            fields:
              - {label: 日付, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false}
              - {label: タイトル, name: title, widget: string}
              - {label: 場所, name: location, widget: string, required: false}
              - {label: 内容, name: description, widget: text}
              - {label: 主催者URL, name: url, widget: string, required: false}
      - name: reports
        label: 活動報告
        file: cms-data/reports.json
        format: json
        fields:
          - label: 活動報告一覧
            name: entries
            widget: list
            required: false
            fields:
              - {label: 日付, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false}
              - {label: タイトル, name: title, widget: string}
              - {label: 内容, name: body, widget: text}
              - label: 写真
                name: images
                widget: list
                required: false
                min: 0
                max: 12
                field: {label: 写真, name: image, widget: image}

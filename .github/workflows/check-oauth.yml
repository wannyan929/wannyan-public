name: Check OAuth draft
on:
  push:
    branches: [main]
    paths:
      - 'worker/oauth-draft.js'
      - 'worker/oauth.test.mjs'
      - '.github/workflows/check-oauth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check worker/oauth-draft.js
      - name: Run OAuth smoke tests
        run: node --test worker/oauth.test.mjs

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任務決行日｜わんにゃん秘密結社</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1728;color:#f5f0e5;font:16px/1.8 system-ui,"Noto Sans JP",sans-serif}header,main,footer{max-width:900px;margin:auto;padding:24px}header{padding-top:44px}a{color:#ebd28f}h1{margin:12px 0}.lead{color:#c7d0de}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0}.toolbar button{background:#26374d;color:#fff;border:1px solid #708198;border-radius:10px;padding:8px 14px;font-size:1.1rem;cursor:pointer}.month{font-weight:700;font-size:1.25rem;min-width:9em;text-align:center}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{text-align:center;color:#b8c6d9}.day{min-height:80px;background:#19283c;border:1px solid #43546a;border-radius:9px;padding:6px;overflow:hidden}.day.muted{opacity:.32}.day.today{outline:2px solid #d8b76c}.num{font-weight:700}.tag{display:block;font-size:.75rem;line-height:1.4;background:#6a5131;color:#fff6df;border-radius:5px;padding:4px;margin-top:5px;overflow-wrap:anywhere}.list{margin-top:30px}.event{border:1px solid #4a5d76;background:#19283c;border-radius:12px;padding:18px;margin:12px 0}.event h3{margin:0}.empty{color:#cbd3dc}footer{color:#aebcd0;font-size:.85rem}@media(max-width:560px){header,main,footer{padding:16px}.day{min-height:64px;padding:3px}.tag{font-size:.63rem}.week{font-size:.8rem}}</style></head><body><header><a href="./index.html">← 秘密基地へ戻る</a><h1>🗓️ 任務決行日</h1><p class="lead">仲間たちのイベント・活動予定を掲載するカレンダー。掲載は主催者の案内を確認してから行います。</p></header><main><div class="toolbar"><button id="prev" aria-label="前の月">‹</button><span id="month" class="month"></span><button id="next" aria-label="次の月">›</button><button id="current">今月</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="days" class="days"></div><section class="list"><h2>今月の任務</h2><div id="eventList"></div></section></main><footer>わんにゃん秘密結社 — 活動は、心の底から大まじめ。</footer><script>
const now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');let year=now.getFullYear(),month=now.getMonth(),events=[];
const pad=n=>String(n).padStart(2,'0');const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function render(){document.getElementById('month').textContent=year+'年'+(month+1)+'月';const days=document.getElementById('days');days.replaceChildren();const first=new Date(year,month,1),start=first.getDay(),count=new Date(year,month+1,0).getDate();for(let i=0;i<Math.ceil((start+count)/7)*7;i++){const day=i-start+1,d=new Date(year,month,day),key=dateKey(d),cell=document.createElement('div');cell.className='day'+(d.getMonth()!==month?' muted':'')+(key===today?' today':'');const n=document.createElement('span');n.className='num';n.textContent=d.getDate();cell.append(n);for(const ev of events.filter(e=>e.date===key)){const tag=document.createElement('span');tag.className='tag';tag.textContent=ev.title;cell.append(tag)}days.append(cell)}const list=document.getElementById('eventList');list.replaceChildren();const items=events.filter(e=>e.date.startsWith(year+'-'+pad(month+1)+'-')).sort((a,b)=>a.date.localeCompare(b.date));if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='現在、この月の掲載予定はありません。確認できた任務から追加していきます。';list.append(p)}for(const ev of items){const item=document.createElement('article');item.className='event';const h=document.createElement('h3');h.textContent=ev.title;item.append(h);for(const s of [ev.date,ev.location,ev.description]){if(!s)continue;const p=document.createElement('p');p.textContent=s;item.append(p)}if(typeof ev.url==='string'&&/^https:\/\//.test(ev.url)){const a=document.createElement('a');a.href=ev.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='主催者の案内を見る ↗';item.append(a)}list.append(item)}}
document.getElementById('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};document.getElementById('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};document.getElementById('current').onclick=()=>{year=now.getFullYear();month=now.getMonth();render()};
(async()=>{try{const r=await fetch('./events.json',{cache:'no-store'});if(r.ok){const data=await r.json();if(Array.isArray(data))events=data.filter(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&typeof e.title==='string')}}catch(e){}render()})();render();
</script></body></html>

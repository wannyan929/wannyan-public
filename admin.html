<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理室｜わんにゃん秘密結社</title><style>*{box-sizing:border-box}body{margin:0;background:#101c30;color:#f6f0e5;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:24px 18px 60px}a{color:#f4d28d}.note{color:#bfcddd}.panel{background:#1b2c44;border:1px solid #52647a;border-radius:16px;padding:20px;margin:20px 0}label{display:block;font-weight:700;margin:15px 0 5px}input,textarea,select{width:100%;padding:13px;font:inherit;border:1px solid #7a8a9c;border-radius:9px;background:#fff;color:#172134}textarea{min-height:110px}button{font:inherit;background:#d9b76a;color:#1b2434;font-weight:700;border:0;border-radius:9px;padding:13px 17px;margin:8px 8px 8px 0;cursor:pointer}button.secondary{background:#354e6d;color:#fff}.status{white-space:pre-wrap;color:#e9dfc6}small{color:#cbd5e2}</style></head><body><main><a href="./index.html">← 秘密基地へ戻る</a><h1>🐾 秘密結社 管理室</h1><p class="note">スマホでイベントの原稿を作るための試作画面です。まだログイン・直接公開機能はありません。入力内容は「原稿をコピー」で保存して、管理者に渡してください。</p><section class="panel"><h2>🗓️ 任務予定の原稿を作る</h2><label for="date">日付</label><input id="date" type="date"><label for="title">イベント名・任務名</label><input id="title" placeholder="例：わんにゃんフェスティバル"><label for="location">場所</label><input id="location" placeholder="例：葛西臨海公園"><label for="description">活動内容</label><textarea id="description" placeholder="例：レスキュードッグ東京さんのお手伝い"></textarea><button id="copy">原稿をコピー</button><button class="secondary" id="share">原稿を共有</button><p id="status" class="status" role="status"></p></section><section class="panel"><h2>📋 活動報告</h2><p>写真・文章を投稿できる機能は準備中。まずはイベント原稿から始めます。</p></section><p><small>安全のため、この画面からGitHubへ書き込みません。公開ページ上にパスワードやアクセストークンを保存しないでください。</small></p></main><script>const el=id=>document.getElementById(id);function draft(){const date=el('date').value,title=el('title').value.trim(),location=el('location').value.trim(),description=el('description').value.trim();if(!date||!title){el('status').textContent='日付とイベント名を入力してください。';return null}return '【任務予定・掲載原稿】\n日付：'+date+'\nイベント名：'+title+'\n場所：'+location+'\n内容：'+description+'\n※掲載前に内容を確認してください。'}el('copy').onclick=async()=>{const s=draft();if(!s)return;try{await navigator.clipboard.writeText(s);el('status').textContent='原稿をコピーしました。メッセージなどに貼り付けられます。'}catch(e){el('status').textContent='コピーできませんでした。共有ボタンを試してください。'}};el('share').onclick=async()=>{const s=draft();if(!s)return;if(navigator.share){try{await navigator.share({title:'任務予定の掲載原稿',text:s});el('status').textContent='共有画面を開きました。'}catch(e){el('status').textContent='共有はキャンセルされました。'}}else{el('status').textContent=s}};</script></body></html>

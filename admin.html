<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c30"><title>管理室｜わんにゃん秘密結社</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101c30;color:#f6f0e5;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:22px 16px 65px}a{color:#f4d28d}.note{color:#c6d2e2}.panel{background:#1b2c44;border:1px solid #52647a;border-radius:16px;padding:19px;margin:18px 0}label{display:block;font-weight:700;margin:15px 0 5px}input,textarea{width:100%;padding:13px;font:inherit;border:1px solid #7a8a9c;border-radius:9px;background:#fff;color:#172134}textarea{min-height:120px}button{font:inherit;background:#d9b76a;color:#1b2434;font-weight:700;border:0;border-radius:10px;padding:12px 15px;margin:8px 7px 8px 0;cursor:pointer}button.secondary{background:#354e6d;color:#fff}.tabs{display:flex;gap:8px}.tabs button{flex:1;margin:0}.tabs button[aria-selected="false"]{background:#344760;color:#fff}.status{white-space:pre-wrap;color:#e9dfc6}small{color:#cbd5e2}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.hide{display:none}.hint{border-left:3px solid #d9b76a;padding-left:12px;color:#cdd8e6}</style></head>
<body><main><a href="./index.html">← 秘密基地へ戻る</a><h1>🐾 秘密結社 管理室</h1><p class="note">スマホ・パソコン両対応の原稿作成室。現在は試作版です。入力しても自動公開されません。</p>
<div class="tabs" role="tablist" aria-label="原稿の種類"><button id="tab-event" role="tab" aria-selected="true" aria-controls="event-panel">🗓️ 任務予定</button><button id="tab-report" role="tab" aria-selected="false" aria-controls="report-panel">📋 活動報告</button></div>
<section class="panel" id="event-panel" role="tabpanel" aria-labelledby="tab-event"><h2>任務予定の原稿</h2><label for="event-date">日付</label><input id="event-date" type="date"><label for="event-title">イベント名・任務名</label><input id="event-title" placeholder="例：わんにゃんフェスティバル"><label for="event-location">場所</label><input id="event-location" placeholder="例：葛西臨海公園"><label for="event-description">活動内容</label><textarea id="event-description" placeholder="例：レスキュードッグ東京さんのお手伝い"></textarea><button id="event-copy">原稿をコピー</button><button class="secondary" id="event-share">原稿を共有</button><p id="event-status" class="status" role="status"></p></section>
<section class="panel hide" id="report-panel" role="tabpanel" aria-labelledby="tab-report"><h2>活動報告の原稿</h2><label for="report-date">活動した日付</label><input id="report-date" type="date"><label for="report-title">活動報告のタイトル</label><input id="report-title" placeholder="例：レスキュードッグ東京さんのお手伝い"><label for="report-location">活動場所</label><input id="report-location" placeholder="例：葛西臨海公園"><label for="report-description">活動の様子・伝えたいこと</label><textarea id="report-description" placeholder="何をしたか、どんな出来事があったかを書いてね"></textarea><label for="report-photos">写真を選ぶ（最大5枚・プレビューのみ）</label><input id="report-photos" type="file" accept="image/*" multiple><div class="photos" id="photo-preview" aria-label="選択した写真のプレビュー"></div><p class="hint">写真はこの端末内で表示するだけ。サーバーには送信されず、原稿のコピーにも含まれません。写真の掲載は後日対応予定です。</p><button id="report-copy">原稿をコピー</button><button class="secondary" id="report-share">原稿を共有</button><p id="report-status" class="status" role="status"></p></section>
<p><small>🔒 この画面は公開URLから誰でも開けます。まだ管理者ログインはありません。住所・電話番号・パスワードなどの個人情報は入力しないでください。原稿は保存されません。</small></p></main>
<script>
const el=id=>document.getElementById(id);
function tab(which){for(const x of ['event','report']){const active=x===which;el('tab-'+x).setAttribute('aria-selected',String(active));el(x+'-panel').classList.toggle('hide',!active)}}
el('tab-event').onclick=()=>tab('event');el('tab-report').onclick=()=>tab('report');
function draft(kind){const date=el(kind+'-date').value,title=el(kind+'-title').value.trim(),location=el(kind+'-location').value.trim(),description=el(kind+'-description').value.trim();if(!date||!title){el(kind+'-status').textContent='日付とタイトルを入力してください。';return null}return '【'+(kind==='event'?'任務予定':'活動報告')+'・掲載原稿】\n日付：'+date+'\nタイトル：'+title+'\n場所：'+location+'\n内容：'+description+(kind==='report'?'\n写真：別途共有（原稿には含まれません）':'')+'\n※掲載前に内容を確認してください。'}
for(const kind of ['event','report']){el(kind+'-copy').onclick=async()=>{const s=draft(kind);if(!s)return;try{await navigator.clipboard.writeText(s);el(kind+'-status').textContent='原稿をコピーしました。メッセージに貼り付けられます。'}catch(e){el(kind+'-status').textContent='コピーできませんでした。共有ボタンを試してください。'}};el(kind+'-share').onclick=async()=>{const s=draft(kind);if(!s)return;if(navigator.share){try{await navigator.share({title:'秘密結社の掲載原稿',text:s});el(kind+'-status').textContent='共有画面を開きました。'}catch(e){el(kind+'-status').textContent='共有を終了しました。'}}else{el(kind+'-status').textContent=s}}}
let urls=[];el('report-photos').onchange=()=>{urls.forEach(URL.revokeObjectURL);urls=[];const preview=el('photo-preview');preview.replaceChildren();const files=Array.from(el('report-photos').files||[]).filter(f=>f.type.startsWith('image/')).slice(0,5);for(const file of files){const url=URL.createObjectURL(file);urls.push(url);const img=document.createElement('img');img.src=url;img.alt='選択した写真のプレビュー';preview.append(img)}el('report-status').textContent=files.length+'枚の写真を選択しました。写真は送信・保存されません。'};
</script></body></html>
